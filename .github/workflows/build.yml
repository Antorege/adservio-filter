name: Build

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Theos
        uses: theos/actions/install-theos@v2

      - name: Build .deb
        run: |
          cd adservio-filter
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdservioFilter
          path: adservio-filter/packages/*.deb

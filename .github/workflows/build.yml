name: Build

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          ln -sf "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
          ln -sf "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          sed -i '' 's/\$(error The "TARGET/$(warning The "TARGET/' $THEOS/makefiles/targets/_common/darwin_head.mk

      - name: Build .deb
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd adservio-filter
          cat > AdservioFilter.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.apple.UIKit</string>
                  </array>
              </dict>
          </dict>
          </plist>
          PLISTEOF
          make package FINALPACKAGE=1 SYSROOT="$SDK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdservioFilter
          path: adservio-filter/packages/*.deb

name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y clang make git curl xz-utils zip jq

      - name: Install ldid
        run: |
          curl -Lo /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid

      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: git clone --recursive https://github.com/theos/theos.git $THEOS

            - name: Download SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          sudo apt-get install -y zstd
          RELEASE=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest)
          SDK_URL=$(echo "$RELEASE" | jq -r '.assets[0].browser_download_url')
          echo "URL: $SDK_URL"
          curl -Lo /tmp/sdk "$SDK_URL"
          file /tmp/sdk
          tar -xf /tmp/sdk -C $THEOS/sdks/ || tar --zstd -xf /tmp/sdk -C $THEOS/sdks/
          ls $THEOS/sdks/

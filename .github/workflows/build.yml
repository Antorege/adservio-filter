name: Build

on: [push]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          ln -sf "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
          ln -sf "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          sed -i '' 's/\$(error The "TARGET/$(warning The "TARGET/' $THEOS/makefiles/targets/_common/darwin_head.mk

      - name: Build .deb
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd adservio-filter
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>Filter</key>\n<dict>\n<key>Bundles</key>\n<array>\n<string>com.apple.UIKit</string>\n</array>\n</dict>\n</dict>\n</plist>\n' > AdservioFilter.plist
          make package FINALPACKAGE=1 SYSROOT="$SDK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdservioFilter
          path: adservio-filter/packages/*.deb
